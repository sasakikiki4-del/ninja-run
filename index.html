<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>忍者ラン - 三段立体忍道・極</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; user-select: none; }
        #canvas { background: linear-gradient(to bottom, #0d1b2a, #1b263b); border: 4px solid #415a77; border-radius: 8px; display: block; margin: 15px auto; }
        kbd { background: #e0e0e0; color: #333; padding: 2px 5px; border-radius: 3px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>走行距離: <span id="score" style="color: #ffd166;">0</span> m</h2>
    <canvas id="canvas" width="800" height="400"></canvas>
    <div>
        <strong>【操作方法】</strong> ジャンプ: <kbd>F</kbd> / <kbd>J</kbd> / <kbd>↑</kbd> ｜ 手裏剣: <kbd>A</kbd> / <kbd>S</kbd> / <kbd>K</kbd> / <kbd>→</kbd> ｜ 足場すり抜け: <kbd>D</kbd> / <kbd>↓</kbd> ｜ <strong>リセット: <kbd>R</kbd> (いつでも可能)</strong>
    </div>

    <script>
    const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
    let state = "PLAYING", score = 0, speed = 7.5, nextX = 700;
    const ninja = { x: 100, y: 200, w: 32, h: 32, vy: 0, g: 0.48, jump: -12.8, grounded: false, emoji: "🥷" };
    let plats = [{ x: 0, y: 340, w: 700, h: 60 }], shurikens = [], enemies = [], keys = {};
    let lastJumpPressed = 0, coyoteTimer = 0, dropTimer = 0;

    function init() {
        state = "PLAYING"; score = 0; speed = 7.5; nextX = 700;
        ninja.x = 100; ninja.y = 200; ninja.vy = 0; ninja.grounded = false; ninja.emoji = "🥷";
        shurikens = []; enemies = []; plats = [{ x: 0, y: 340, w: 700, h: 60 }];
        coyoteTimer = dropTimer = lastJumpPressed = 0; keys = {}; 
    }

    window.addEventListener("keydown", e => {
        const k = e.key.toUpperCase();
        keys[k] = true;
        if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowRight") keys[e.key] = true;
        
        if (k === "R") { init(); return; }

        if (state === "PLAYING") {
            if (k === "F" || k === "J" || e.key === "ArrowUp") {
                lastJumpPressed = performance.now();
                e.preventDefault();
            }
            if (k === "A" || k === "S" || k === "K" || e.key === "ArrowRight") {
                shurikens.push({ x: ninja.x + 32, y: ninja.y + 10, v: 18, angle: 0, reflected: false });
                e.preventDefault();
            }
            // 【バグ修正】忍者の足元が一番下の足場（高さ340px、忍者の足元は340px）にある時はすり抜けを無効化
            if (k === "D" || e.key === "ArrowDown") {
                if (ninja.y < 300) { // 下段の床（340px）より明らかに上にいる場合のみすり抜けを許可
                    dropTimer = 10;
                    ninja.grounded = false;
                }
                e.preventDefault();
            }
        }
    });

    window.addEventListener("keyup", e => {
        const k = e.key.toUpperCase();
        delete keys[k];
        if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowRight") delete keys[e.key];
    });

    function update() {
        if (state !== "PLAYING") return;
        score += 0.15; speed = 7.5 + (score * 0.002); ninja.x += speed;
        
        if (ninja.grounded) coyoteTimer = 6; else if (coyoteTimer > 0) coyoteTimer--;
        if (dropTimer > 0) dropTimer--;

        let isJump = (keys["F"] || keys["J"] || keys["ArrowUp"]) || (performance.now() - lastJumpPressed < 100);
        if (isJump && (ninja.grounded || coyoteTimer > 0)) {
            ninja.vy = ninja.jump;
            ninja.grounded = false;
            coyoteTimer = lastJumpPressed = 0;
        }
        if (ninja.vy < 0 && !(keys["F"] || keys["J"] || keys["ArrowUp"])) ninja.vy += 0.7;
        ninja.vy += ninja.g; ninja.y += ninja.vy;

        while (nextX < ninja.x + 1200) {
            let gapL = Math.floor(Math.random()*80)+50, gapM = Math.floor(Math.random()*120)+40, gapU = Math.floor(Math.random()*160)+40;
            let wL = Math.floor(Math.random()*300)+250, wM = Math.floor(Math.random()*250)+200, wU = Math.floor(Math.random()*200)+150;
            let curPlats = [], pats = [{u:1,m:1,l:0},{u:0,m:1,l:1},{u:1,m:0,l:1},{u:1,m:1,l:1}], sel = pats[Math.floor(Math.random()*pats.length)];
            
            if (sel.u) { let p={x:nextX+gapU,y:80,w:wU,h:20}; plats.push(p); curPlats.push(p); }
            if (sel.m) { let p={x:nextX+gapM,y:210,w:wM,h:20}; plats.push(p); curPlats.push(p); }
            if (sel.l) { let p={x:nextX+gapL,y:340,w:wL,h:60}; plats.push(p); curPlats.push(p); }
            
            let safeIdx = Math.floor(Math.random() * curPlats.length);
            curPlats.forEach((plat, idx) => {
                if (idx === safeIdx) return;
                let count = plat.w < 180 ? 1 : Math.floor(Math.random()*3)+1, type = Math.random()<0.6 ? "🦂" : "🐢", start = 60;
                for (let i = 0; i < count; i++) {
                    let ex = plat.x + start + i * 45; if (ex > plat.x + plat.w - 40) break;
                    enemies.push({ x: ex, y: plat.y-32, w: 32, h: 32, type: type, baseY: plat.y-32, t: 0, vx: -0.3 });
                }
            });
            if (Math.random() < 0.3) { let hy = Math.random()<0.5 ? 130 : 250; enemies.push({ x: nextX+300, y: hy, w: 32, h: 32, type: "🦅", baseY: hy, t: Math.random()*5, vx: -5.5 }); }
            nextX += Math.max(gapL+wL, gapM+wM, gapU+wU) - 80;
        }

        ninja.grounded = false;
        if (dropTimer === 0) {
            for (let p of plats) {
                if (ninja.x+ninja.w > p.x && ninja.x < p.x+p.w && ninja.y+ninja.h >= p.y && ninja.y+ninja.h-ninja.vy <= p.y+12) {
                    ninja.y = p.y-ninja.h; ninja.vy = 0; ninja.grounded = true;
                }
            }
        }
        if (ninja.y > 410) { triggerGameOver(); }

        for (let i = shurikens.length - 1; i >= 0; i--) { 
            let s = shurikens[i]; s.x += s.v; s.angle += 0.4; 
            if (s.reflected) {
                if (s.x < ninja.x + ninja.w && s.x + 24 > ninja.x && s.y < ninja.y + ninja.h && s.y + 24 > ninja.y) {
                    triggerGameOver(); return;
                }
                for (let j = shurikens.length - 1; j >= 0; j--) {
                    let normalS = shurikens[j];
                    if (!normalS.reflected && Math.abs(s.x - normalS.x) < 20 && Math.abs(s.y - normalS.y) < 24) {
                        shurikens.splice(Math.max(i, j), 1); shurikens.splice(Math.min(i, j), 1);
                        i--; break;
                    }
                }
            }
            if (shurikens[i] && (shurikens[i].x > ninja.x+800 || shurikens[i].x < ninja.x - 200)) shurikens.splice(i, 1); 
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i]; e.x += e.vx;
            if (e.type === "🦅") { e.t += 0.06; e.y = e.baseY + Math.sin(e.t)*65; }
            
            let hit = ninja.x < e.x+28 && ninja.x+28 > e.x && ninja.y < e.y+28 && ninja.y+28 > e.y;
            if (hit) {
                let isAir = !ninja.grounded || Math.abs(ninja.vy) > 0.01, isAbove = (ninja.y+ninja.h) <= (e.y+32);
                if ((e.type==="🐢"||e.type==="🦅") && isAir && isAbove) {
                    enemies.splice(i, 1); 
                    ninja.vy = (keys["F"]||keys["J"]||keys["ArrowUp"]) ? ninja.jump*0.85 : ninja.jump*0.55; 
                    ninja.grounded = false; score += 10; continue;
                } else { 
                    if (e.type === "🐢" && isAir) continue; 
                    triggerGameOver(); return; 
                }
            }

            for (let j = shurikens.length - 1; j >= 0; j--) {
                let s = shurikens[j];
                if (s.x < e.x+32 && s.x+24 > e.x && s.y < e.y+32 && s.y + 24 > e.y) { 
                    if (e.type==="🦂"||e.type==="🦅") { enemies.splice(i, 1); shurikens.splice(j, 1); score += 15; break; } 
                    else if (e.type==="🐢" && !s.reflected) { s.v = -10; s.y -= 4; s.reflected = true; } 
                }
            }
            if (e.x < ninja.x - 200) enemies.splice(i, 1);
        }
    }

    function triggerGameOver() {
        state = "GAMEOVER";
        ninja.emoji = "💥";
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 400); ctx.save(); ctx.translate(-(ninja.x-100), 0); ctx.fillStyle = "#334155";
        for (let p of plats) ctx.fillRect(p.x, p.y, p.w, p.h);
        
        ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        for (let s of shurikens) { ctx.save(); ctx.translate(s.x+12, s.y+12); ctx.rotate(s.angle); ctx.fillText("⚙️", 0, 0); ctx.restore(); }
        
        ctx.font = "32px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
        for (let e of enemies) ctx.fillText(e.type, e.x, e.y); 
        ctx.fillText(ninja.emoji, ninja.x, ninja.y);
        ctx.restore();
        
        document.getElementById("score").innerText = Math.floor(score);
        if (state === "GAMEOVER") {
            ctx.fillStyle = "rgba(0,0,0,0.88)"; ctx.fillRect(0, 0, 800, 400); ctx.textAlign = "center";
            ctx.fillStyle = "#ffd166"; ctx.font = "bold 52px sans-serif"; ctx.fillText(`記録: ${Math.floor(score)} m`, 400, 170);
            ctx.fillStyle = "#ffffff"; ctx.font = "24px sans-serif"; ctx.fillText("【 任務終了 】", 400, 240);
            ctx.fillStyle = "#a8dadc"; ctx.font = "16px sans-serif"; ctx.fillText("R キーを押して再び忍道へ", 400, 290);
        }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
    </script>
</body>
</html>
